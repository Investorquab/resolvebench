<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="ResolveBench mark">
  <!-- Container tile: the "bench" -->
  <rect x="6" y="6" width="108" height="108" rx="27" fill="#0E1116" stroke="#2A313C" stroke-width="2"/>
  <!-- Commit boundary in time -->
  <line x1="60" y1="33" x2="60" y2="87" stroke="#C7CED6" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Sealed answer (committed before the outcome exists) -->
  <circle cx="40" cy="60" r="9" fill="#E8B04B"/>
  <circle cx="40" cy="60" r="15" fill="none" stroke="#E8B04B" stroke-width="2" opacity="0.45"/>
  <!-- Reality grades it true -->
  <polyline points="69,61 78,71 93,47" fill="none" stroke="#43B59A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
